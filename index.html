<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MM Automóviles | Vehículos Seleccionados</title>
  
  <!-- Netlify Identity Widget (Necesario para activar contraseñas y login) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
    }
    header {
      background-color: #000000;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #e50914;
    }
    header h1 {
      color: #e50914;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .hero {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(180deg, #1f1f1f 0%, #121212 100%);
    }
    .hero h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .hero p {
      color: #aaa;
      font-size: 16px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
    }
    .card-title {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .card-price {
      color: #e50914;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .card-details {
      color: #888;
      font-size: 14px;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
      border-top: 1px solid #222;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MM Automóviles</h1>
  </header>

  <section class="hero">
    <h2>ENCONTRÁ TU PRÓXIMO AUTO</h2>
    <p>Usados seleccionados con la mejor atención y garantía.</p>
  </section>

  <main class="container">
    <h3 style="margin-bottom: 15px; color: #fff;">Vehículos</h3>
    <div class="grid" id="catalogo">
      <!-- Los autos subidos desde el panel aparecerán en esta sección -->
    </div>
  </main>

  <footer>
    <p>&copy; MM Automóviles - Todos los derechos reservados</p>
  </footer>

  <!-- Script para redireccionar automáticamente al panel si entran desde la invitación del mail -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

</body>
</html>
