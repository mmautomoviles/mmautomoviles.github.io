<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM Automóviles</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-car"></i> MM Automóviles
            </h1>
            <button id="adminBtn" class="bg-slate-700 hover:bg-slate-600 text-sm px-4 py-2 rounded-lg transition text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-lock"></i> Acceso Admin
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-4 w-full flex-grow">
        <h2 class="text-xl font-semibold mb-6 text-slate-300 border-b border-slate-800 pb-2">Catálogo de Vehículos</h2>
        <div id="catalog" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-slate-400 col-span-full text-center py-10">Cargando vehículos...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 text-center p-4 text-xs text-slate-500">
        &copy; MM Automóviles. Todos los derechos reservados.
    </footer>

    <!-- Modal Admin -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 rounded-xl max-w-lg w-full p-6 border border-slate-700 relative max-h-[90vh] overflow-y-auto">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <!-- Login Form -->
            <div id="loginForm" class="space-y-4">
                <h3 class="text-xl font-bold text-slate-100">Iniciar Sesión</h3>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Contraseña de administrador</label>
                    <input type="password" id="adminPassword" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white outline-none focus:border-red-500" placeholder="Ingrese contraseña">
                </div>
                <button id="loginBtn" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded font-semibold transition">Ingresar</button>
            </div>

            <!-- Panel de Administración -->
            <div id="adminPanel" class="space-y-4 hidden">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                    <h3 class="text-xl font-bold text-slate-100">Agregar Nuevo Vehículo</h3>
                    <button id="logoutBtn" class="text-xs text-red-400 hover:underline">Cerrar sesión</button>
                </div>
                
                <form id="addCarForm" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400">Marca y Modelo</label>
                        <input type="text" id="carTitle" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="Ej: Chevrolet Onix 1.0">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400">Año</label>
                            <input type="number" id="carYear" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="2021">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400">Precio (USD)</label>
                            <input type="number" id="carPrice" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="12500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400">URL de la Imagen (Link)</label>
                        <input type="url" id="carImageUrl" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="https://ejemplo.com/foto.jpg">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400">Descripción / Detalles</label>
                        <textarea id="carDesc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="Ej: Excelente estado, 45.000 km, único dueño."></textarea>
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold transition">Publicar Vehículo</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE (Reemplazar con tus datos)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROJECT_ID.firebaseapp.com",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_PROJECT_ID.firebasestorage.app",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referencias DOM
        const adminBtn = document.getElementById('adminBtn');
        const adminModal = document.getElementById('adminModal');
        const closeModal = document.getElementById('closeModal');
        const loginForm = document.getElementById('loginForm');
        const adminPanel = document.getElementById('adminPanel');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const addCarForm = document.getElementById('addCarForm');
        const catalog = document.getElementById('catalog');

        let isAdmin = false;

        // Abrir/Cerrar Modal
        adminBtn.onclick = () => adminModal.classList.remove('hidden');
        closeModal.onclick = () => adminModal.classList.add('hidden');

        // Login simple
        loginBtn.onclick = () => {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "admin123") { // Podés cambiar esta contraseña
                isAdmin = true;
                loginForm.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                renderCatalog();
            } else {
                alert("Contraseña incorrecta");
            }
        };

        logoutBtn.onclick = () => {
            isAdmin = false;
            adminPanel.classList.add('hidden');
            loginForm.classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
            renderCatalog();
        };

        // Guardar auto en Firestore
        addCarForm.onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('carTitle').value;
            const year = document.getElementById('carYear').value;
            const price = document.getElementById('carPrice').value;
            const imageUrl = document.getElementById('carImageUrl').value;
            const desc = document.getElementById('carDesc').value;

            try {
                await addDoc(collection(db, "autos"), {
                    title, year, price, imageUrl, desc, createdAt: new Date()
                });
                addCarForm.reset();
                alert("¡Vehículo publicado con éxito!");
                renderCatalog();
            } catch (err) {
                console.error(err);
                alert("Error al publicar el vehículo.");
            }
        };

        // Cargar autos desde Firestore
        async function renderCatalog() {
            catalog.innerHTML = "<p class='text-slate-400 col-span-full text-center py-10'>Cargando catálogo...</p>";
            try {
                const querySnapshot = await getDocs(collection(db, "autos"));
                if (querySnapshot.empty) {
                    catalog.innerHTML = "<p class='text-slate-500 col-span-full text-center py-10'>No hay vehículos publicados aún.</p>";
                    return;
                }

                catalog.innerHTML = "";
                querySnapshot.forEach((docSnapshot) => {
                    const car = docSnapshot.data();
                    const carId = docSnapshot.id;

                    const card = document.createElement('div');
                    card.className = "bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-md flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <img src="${car.imageUrl}" alt="${car.title}" class="w-full h-48 object-cover bg-slate-900" onerror="this.src='https://via.placeholder.com/400x250?text=Sin+Imagen'">
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-lg text-white">${car.title}</h3>
                                    <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">${car.year}</span>
                                </div>
                                <p class="text-2xl font-bold text-green-400 mb-2">U$S ${car.price}</p>
                                <p class="text-xs text-slate-400 line-clamp-3">${car.desc || ''}</p>
                            </div>
                        </div>
                        ${isAdmin ? `
                            <div class="p-4 pt-0">
                                <button onclick="deleteCar('${carId}')" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-400 py-1 rounded text-xs transition border border-red-500/30">
                                    <i class="fa-solid fa-trash"></i> Eliminar publicación
                                </button>
                            </div>
                        ` : ''}
                    `;
                    catalog.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                catalog.innerHTML = "<p class='text-red-400 col-span-full text-center py-10'>Error al cargar el catálogo.</p>";
            }
        }

        // Eliminar auto
        window.deleteCar = async (id) => {
            if (confirm("¿Estás seguro de eliminar esta publicación?")) {
                await deleteDoc(doc(db, "autos", id));
                renderCatalog();
            }
        };

        renderCatalog();
    </script>
</body>
</html>
