<script>
    // ⚠️ PONÉ ACÁ TU NÚMERO REAL CON CÓDIGO DE PAÍS (Ej para Uruguay: 59899123456)
    const TELEFONO_WHATSAPP = "59899123456";

    // Función que abre WhatsApp directamente con el auto seleccionado
    function verDetalles(auto) {
      const mensaje = encodeURIComponent("Hola MMautomoviles! Quisiera consultar por el siguiente auto que vi en la web: " + auto);
      window.open("https://wa.me/" + TELEFONO_WHATSAPP + "?text=" + mensaje, "_blank");
    }

    // Función para el botón general de consignar
    function consignarWhatsApp() {
      const mensaje = encodeURIComponent("Hola MMautomoviles! Tengo un auto que me gustaría vender a consignación con ustedes.");
      window.open("https://wa.me/" + TELEFONO_WHATSAPP + "?text=" + mensaje, "_blank");
    }

    // Filtros en tiempo real
    function filtrarAutos() {
      const marca = document.getElementById('filter-marca').value;
      const transmision = document.getElementById('filter-transmision').value;
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const matchMarca = !marca || card.dataset.marca === marca;
        const matchTransmision = !transmision || card.dataset.transmision === transmision;

        if (matchMarca && matchTransmision) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
